# Absolute-fitness non-invariance, probabilistic genotype-phenotype map (PrGP).
#
# Each genotype expresses a distribution over phenotypes. Shifting both
# reproduction rates by the same constant now changes the dynamics, which
# classical population genetics says cannot happen. Compare with absfit_prgp.yaml.

experiment: absfit_prgp
seed: 42

landscape:
  adjacency:   ../data/absfit/adjacency.txt
  pheno_probs: ../data/absfit/pheno_probs_prgp.txt
  repro_probs: ../data/absfit/repro_probs.txt

simulation:
  pop_size: 10000
  n_cycles: 500
  generations_per_cycle: 10
  offspring_per_division: 1
  mutation_rate: 0.0
  init: {kind: uniform_over_support}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "propgen"
version = "1.0.0"
description = "Probabilistic Phenotype Genetics: evolutionary dynamics under phenotypic uncertainty"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Vaibhav Mohanty" },
    { name = "Anna Sappington" },
    { name = "Eugene I. Shakhnovich" },
    { name = "Bonnie Berger" },
]
keywords = ["population genetics", "evolution", "phenotypic plasticity", "simulation"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Needed only to execute the figure notebooks.
figures = ["matplotlib>=3.7,<4", "mpmath>=1.3"]
dev = [
    "ruff",
    "nbstripout",
    "nbconvert",
    "ipykernel",
]

[project.urls]
Homepage = "https://github.com/vastcollab/ProPGen"
Preprint = "https://doi.org/10.64898/2026.03.15.711953"

[project.scripts]
propgen = "propgen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/propgen"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
